[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openproject-intent-api"
version = "0.1.0"
description = "Standalone FastAPI service for processing user intent"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "uvicorn[standard]>=0.29,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]